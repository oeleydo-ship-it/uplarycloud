name: docker-control-plane

x-app: &app
  build:
    context: .
    dockerfile: .docker/Dockerfile
  env_file: .env
  environment:
    APP_ENV: production
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "artisan", "platform:doctor", "--json"]
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 30s
  restart: unless-stopped

services:
  app:
    <<: *app
    command: php-fpm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan queue:work redis --queue=deployments,infrastructure,provisioning,networking,backups,notifications,monitoring,default --sleep=1 --tries=3 --backoff=10 --timeout=900
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-control_plane}
      MYSQL_USER: ${DB_USERNAME:-control_plane}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  redis-data:
